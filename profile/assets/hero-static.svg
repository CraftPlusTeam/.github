<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">CraftPlusTeam — Build together. Ship something real.</title>
<desc id="desc">黒とシアンの波形ヘッダー。キャッチコピーがタイプされ、波がゆっくり動きます。</desc>

<defs>
<linearGradient id="wave" x1="0" x2="1"><stop stop-color="#003D59"/><stop offset=".52" stop-color="#00D9FF"/><stop offset="1" stop-color="#005376"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
<clipPath id="typing"><rect class="type-reveal" x="220" y="210" width="760" height="60"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="380" fill="#0D1117"/>
<path d="M-100 28Q200 100 500 40T1300 40V-20H-100Z" fill="#003247" opacity=".7" class="wave-back"/>
<path d="M-100 1Q200 65 550 12T1300 15V-20H-100Z" fill="url(#wave)" class="wave" opacity=".8"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<text x="600" y="110" fill="#8B949E" font-size="18" letter-spacing="6">IDEAS INTO PRODUCTS</text>
<text x="600" y="188" fill="#00D9FF" font-size="81" font-weight="700" letter-spacing="-3">CraftPlusTeam</text>
<text x="600" y="249" fill="#C9D1D9" font-family="monospace" font-size="29" clip-path="url(#typing)">Build together. Ship something real.</text>
</g>
<path d="M-100 337Q150 266 460 325T1300 316V400H-100Z" fill="#003247" class="wave-back"/>
<path d="M-100 366Q200 295 580 351T1300 335V400H-100Z" fill="url(#wave)" opacity=".65" class="wave"/>
</g>
</svg>
