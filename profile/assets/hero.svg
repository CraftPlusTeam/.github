    <rect x="18" y="37" width="218" height="218" rx="40" transform="rotate(-8 127 146)" fill="#213F46" stroke="#7DABA1" stroke-opacity=".45"/>
    <rect width="218" height="218" rx="40" fill="#D3F989"/>
    <path d="M109 62V156M62 109H156" stroke="#172D37" stroke-width="22" stroke-linecap="round"/>
